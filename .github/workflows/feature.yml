name: Feature Branch CI

on:
  push:
    branches:
      - feature/*
  # Prevent running the entire workflow when changes are made to the README.md
    paths-ignore:
      - 'README.md'

jobs:
  # Build, Run Unit & Integration Tests 🔨
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Run Unit and Integration tests
        run: mvn verify


  # Run security scans to make sure everything is ✅
  security-scan:
    needs: build-and-test  # Depends on successful build and testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}