name: Feature Branch CI

on:
  push:
    branches:
      - feature/*
  # Prevent running the entire workflow when changes are made to the README.md
    paths-ignore:
      - 'README.md'

jobs:
  # Run unit tests and build the project 🔨
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Run Unit Tests
        run: mvn test

      - name: Build the project and get artifact name
        id: build
        run: mvn clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.repository }}-${{ github.sha }}.jar  # Naming artifact with repo name & commit SHA
          path: target/


  # Run security scans to make sure everything is ✅
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  # Run integration tests to make sure everything is ✅
  integration-test:
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}  # Reference build job output
          path: target/  # Download location within the job's workspace

      - name: Run integration tests
        run: mvn verify -DskipTests