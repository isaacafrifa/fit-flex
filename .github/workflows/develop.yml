name: Develop Branch CI

# This workflow is triggered whenever a new PR is created to the develop branch
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  # Prevent running the entire workflow when changes are made to the README.md
    paths-ignore:
      - 'README.md'

jobs:
  # Build, Run Unit & Integration Tests 🔨
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Run Unit and Integration tests
        run: mvn verify

      - name: Upload Test Reports (if failure)
        uses: actions/upload-artifact@v4
        if: failure()  # If the previous step (i.e. mvn verify) fails, failure() evaluates to true
        with:
          name: test-reports
          path: target/surefire-reports/*.xml


  # Run security scans to make sure everything is ✅
  security-scan:
    needs: build-and-test  # Depends on successful build and testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}