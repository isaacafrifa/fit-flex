name: Deploy to Dev environment

on:
  workflow_dispatch:

jobs:
  #   Extract the project version from pom.xml
  extract-project-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Extract version
        id: extract_version
        run: |
          echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_ENV
          echo "::set-output name=VERSION::$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)"

      - name: Print project version
        run: echo "VERSION=${{ steps.extract_version.outputs.VERSION }}"

    outputs:
      version: ${{ steps.extract_version.outputs.VERSION }}


    #   Build and push docker image to DockerHub
  build-and-push:
    needs: extract-project-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # If the login fails, the job will stop and an error will be thrown
        continue-on-error: false

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fitflex:${{ needs.build-image.outputs.version }}

